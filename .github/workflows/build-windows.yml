name: Build Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解码图标
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD\assets\icon.ico", [Convert]::FromBase64String((Get-Content "$PWD\assets\icon.ico.b64" -Raw).Trim()))
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 构建独立 exe (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "YZLLauncher" --collect-all customtkinter --collect-all tkinterdnd2 main.py
          Get-Item dist\YZLLauncher.exe | Select-Object Name,Length
      - name: 安装 Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe","C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "== try choco =="
            choco install innosetup -y --no-progress *> choco.log 2>&1
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe","C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Host "== try winget =="
            winget install --id JRSoftware.InnoSetup -e --source winget --accept-source-agreements --accept-package-agreements --silent --disable-interactivity *> winget.log 2>&1
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe","C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Host "== try direct download =="
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:TEMP\is.exe" -UseBasicParsing
            Start-Process -Wait -FilePath "$env:TEMP\is.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-"
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe","C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "All Inno Setup install methods failed"; exit 1 }
          Write-Host "ISCC found: $($iscc.FullName)"
      - name: 构建独立安装包 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe","C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC not found"; exit 1 }
          & $iscc.FullName "YZLLauncher.iss"
          Get-ChildItem Output | Select-Object Name,Length
      - name: 发布 Release v1.4.4
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist 2>/dev/null || true
          ls -la Output 2>/dev/null || true
          gh release delete v1.4.4 --yes --cleanup-tag 2>/dev/null || true
          if [ -f "Output/YZLLauncher-Setup-1.4.4.exe" ]; then
            gh release create v1.4.4 --repo "$GITHUB_REPOSITORY" --title "YZL 启动器 v1.4.4" --notes "v1.4.4：①模组中心/光影中心默认即可浏览全部模组与全部光影（像 PCL 一样翻页『加载更多』翻到底），不再只显示精选；②搜索与精选保留，一键切换；③资源按当前版本+加载器自动适配。" dist/YZLLauncher.exe "Output/YZLLauncher-Setup-1.4.4.exe"
          else
            gh release create v1.4.4 --repo "$GITHUB_REPOSITORY" --title "YZL 启动器 v1.4.4" --notes "v1.4.4：①模组中心/光影中心默认即可浏览全部模组与全部光影（像 PCL 一样翻页『加载更多』翻到底），不再只显示精选；②搜索与精选保留，一键切换；③资源按当前版本+加载器自动适配。" dist/YZLLauncher.exe
          fi