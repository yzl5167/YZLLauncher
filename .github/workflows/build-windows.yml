name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解码图标
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD\assets\icon.ico", [Convert]::FromBase64String((Get-Content "$PWD\assets\icon.ico.b64" -Raw).Trim()))
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 构建独立 exe (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "YZLLauncher" --collect-all customtkinter main.py
          Get-Item dist\YZLLauncher.exe | Select-Object Name,Length
      - name: 安装 Inno Setup 6
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:TEMP\is.exe" -UseBasicParsing
          Start-Process -Wait -FilePath "$env:TEMP\is.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-"
          Get-ChildItem "C:\Program Files (x86)\Inno Setup*" | Select-Object FullName
      - name: 构建独立安装包 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC not found"; exit 1 }
          Write-Host "Using ISCC: $($iscc.FullName)"
          & $iscc.FullName "YZLLauncher.iss"
          Get-ChildItem Output | Select-Object Name,Length
      - name: 发布 Release v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist 2>/dev/null || true
          ls -la Output 2>/dev/null || true
          if [ -f "Output/YZLLauncher-Setup-1.0.0.exe" ]; then
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --title "YZL 启动器 v1.0.0" --notes "Windows 独立安装包（免 Python）" \
              dist/YZLLauncher.exe "Output/YZLLauncher-Setup-1.0.0.exe"
          else
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --title "YZL 启动器 v1.0.0" --notes "Windows 独立安装包（免 Python）" \
              dist/YZLLauncher.exe
          fi
