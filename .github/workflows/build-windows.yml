name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解码图标
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD\assets\icon.ico", [Convert]::FromBase64String((Get-Content "$PWD\assets\icon.ico.b64" -Raw).Trim()))
          Get-Item "$PWD\assets\icon.ico" | Select-Object Name,Length
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
          where python pyinstaller
      - name: 构建独立 exe (PyInstaller)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "YZLLauncher" --collect-all customtkinter main.py *> pyinstaller.log 2>&1
          Write-Host "pyinstaller exit: $LASTEXITCODE"
          exit $LASTEXITCODE
      - name: 上传构建日志
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f pyinstaller.log ]; then
            gh api -X PUT repos/yzl5167/YZLLauncher/contents/build/pyinstaller.log \
              -f message="build log from action" -f content="$(base64 -w0 pyinstaller.log)" || echo "upload failed"
          else
            echo "no log file"
          fi
      - name: 安装 Inno Setup 6 (winget)
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --silent
      - name: 构建独立安装包 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          Write-Host "Using ISCC: $($iscc.FullName)"
          & $iscc.FullName "YZLLauncher.iss"
          Get-ChildItem Output | Select-Object Name,Length
      - name: 发布 Release v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist Output
          gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --title "YZL 启动器 v1.0.0" --notes "Windows 独立安装包（免 Python）" \
            "dist/YZLLauncher.exe" "Output/YZLLauncher-Setup-1.0.0.exe"
