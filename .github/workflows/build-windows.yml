name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解码图标
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD\assets\icon.ico", [Convert]::FromBase64String((Get-Content "$PWD\assets\icon.ico.b64" -Raw).Trim()))
          Get-Item "$PWD\assets\icon.ico" | Select-Object Name,Length
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 构建独立 exe (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "YZLLauncher" `
            --collect-all customtkinter `
            main.py
          ls -la dist
      - name: 安装 Inno Setup 6 (winget)
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --silent
      - name: 构建独立安装包 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          Write-Host "Using ISCC: $($iscc.FullName)"
          & $iscc.FullName "YZLLauncher.iss"
          Get-ChildItem Output | Select-Object Name,Length
      - name: 发布 Release v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist Output
          gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --title "YZL 启动器 v1.0.0" --notes "Windows 独立安装包（免 Python）" \
            "dist/YZLLauncher.exe" "Output/YZLLauncher-Setup-1.0.0.exe"
